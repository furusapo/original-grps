<script>
(() => {
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.querySelectorAll('.grps-canvas').forEach(canvas=>{
  const w=Number(canvas.dataset.designWidth),h=Number(canvas.dataset.designHeight);
  const load=(kind,callback)=>{
   const obj=canvas.querySelector('.grps-layer-'+kind);
   if(!obj)return;
   const run=()=>{try{const doc=obj.contentDocument;if(doc?.documentElement)callback(doc)}catch(e){console.warn('SVG layer unavailable',kind,e)}};
   obj.addEventListener('load',run);if(obj.contentDocument?.documentElement)run();
  };
  const visible=()=>getComputedStyle(canvas).display!=='none';
  const watch=(x,y,fn)=>{
   const trigger=document.createElement('span');Object.assign(trigger.style,{position:'absolute',left:(x/w*100)+'%',top:(y/h*100)+'%',width:'1px',height:'1px',pointerEvents:'none',visibility:'hidden'});canvas.appendChild(trigger);
   if(reduced||!('IntersectionObserver'in window)){fn();trigger.remove();return}
   const observer=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting&&visible()){fn();observer.disconnect();trigger.remove()}}},{rootMargin:'0px 0px -8% 0px'});
   observer.observe(trigger);
  };
  if(canvas.classList.contains('grps-mobile')){
   load('line',doc=>{
    const lines=[...doc.querySelectorAll('line.grps-line-draw')];

    lines.forEach(line=>{
     const y=Number(line.getAttribute('y1'));
     if(!Number.isFinite(y))return;

     if(reduced || !('IntersectionObserver' in window)){
      line.classList.add('is-drawing');
      return;
     }

     const marker=document.createElement('span');
     Object.assign(marker.style,{
      position:'absolute',
      left:'50%',
      top:(y/h*100)+'%',
      width:'2px',
      height:'2px',
      pointerEvents:'none'
     });
     canvas.appendChild(marker);

     let frame1=0;
     let frame2=0;
     let active=false;

     const reset=()=>{
      cancelAnimationFrame(frame1);
      cancelAnimationFrame(frame2);
      line.classList.remove('is-drawing');
     };

     const observer=new IntersectionObserver(entries=>{
      for(const entry of entries){
       const inside=entry.isIntersecting && visible();

       if(inside===active)continue;
       active=inside;

       if(inside){
        reset();
        frame1=requestAnimationFrame(()=>{
         frame2=requestAnimationFrame(()=>{
          if(active)line.classList.add('is-drawing');
         });
        });
       }else{
        reset();
       }
      }
     },{rootMargin:'0px 0px -12% 0px'});

     observer.observe(marker);
    });
   });
   load('photo',doc=>{
    const groups=[...doc.querySelectorAll('svg > g.grps-photo-piece')];
    const show=()=>{
     groups.forEach((group,index)=>{
      setTimeout(()=>group.classList.add('is-visible'),
       reduced?0:index*650);
     });
    };
    if(reduced||!('IntersectionObserver' in window)){
     show();
    }else{
     const observer=new IntersectionObserver(entries=>{
      if(entries.some(e=>e.isIntersecting)&&visible()){
       show();
       observer.disconnect();
      }
     },{threshold:0.01});
     observer.observe(canvas);
    }
   });
  }else{
   load('line',doc=>{
    const lines=[...doc.querySelectorAll('line')];
    lines.forEach(line=>{const length=line.getTotalLength();line.style.strokeDasharray=String(length);line.style.strokeDashoffset=reduced?'0':String(length)});
    lines.forEach(line=>{const y=Number(line.getAttribute('y1')||line.getAttribute('y2'));if(Number.isFinite(y))watch(w/2,y,()=>{line.style.strokeDashoffset='0'})});
   });
   load('photo',doc=>{
    const groups=[...doc.querySelectorAll('svg > g')];
    groups.forEach(group=>{const b=group.getBBox();watch(b.x+b.width/2,b.y+b.height/2,()=>group.classList.add('is-visible'))});
   });
  }
  const button=canvas.querySelector('.grps-layer-button, .grps-layer-link');
  canvas.querySelectorAll('.grps-hotspot').forEach(link=>{
   const key=link.dataset.action;
   if(!['service-top','contact-top','form','line'].includes(key))return;
   const index=['service-top','contact-top','form','line'].indexOf(key);
   const groupIndex=canvas.classList.contains('grps-mobile')?(index<2?0:-1):(index>=2?index-2:-1);
   if(groupIndex<0)return;
   const active=on=>{try{const groups=button?.contentDocument?.querySelectorAll('svg > g');groups?.[groupIndex]?.classList.toggle('is-active',on)}catch(e){}};
   link.addEventListener('pointerenter',()=>active(true));link.addEventListener('pointerleave',()=>active(false));link.addEventListener('focus',()=>active(true));link.addEventListener('blur',()=>active(false));
  });
 });
})();
</script>

<script src="./assets/grps-shared-header.js" defer></script>
<div id="grps-liquid-intro" role="status" aria-label="グローパスのロゴを表示しています">
 <div class="grps-liquid-stage">
  <canvas id="grps-liquid-three" aria-hidden="true"></canvas>
  <div class="grps-liquid-halo" aria-hidden="true"></div>
  <div class="grps-shield-window"><img src="./grps_images/glowpas-logo-vertical.png" alt="グローパスのシンボルマーク"></div>
  <div class="grps-liquid-label" aria-hidden="true">GROWPASS</div>
 </div>
</div>
<script type="module">
(async function(){
 const root=document.getElementById('grps-liquid-intro');
 if(!root||!document.documentElement.classList.contains('grps-show-liquid-intro')){root?.remove();return}
 let stopped=false,renderer=null,frame=0;
 const finish=()=>{if(stopped)return;stopped=true;cancelAnimationFrame(frame);root.classList.add('is-done');document.documentElement.classList.remove('grps-show-liquid-intro');setTimeout(()=>{renderer?.dispose();root.remove()},700)};
 const timeout=setTimeout(finish,3400);
 window.addEventListener('pageshow',e=>{if(e.persisted){clearTimeout(timeout);finish()}},{once:true});
 try{
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  if(stopped)return;
  const canvas=root.querySelector('canvas'),stage=root.querySelector('.grps-liquid-stage');
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(w,h,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,w/h,.1,100);camera.position.z=7;
  scene.add(new THREE.AmbientLight(0xffffff,2.4));
  const key=new THREE.DirectionalLight(0xffffff,5);key.position.set(-3,4,5);scene.add(key);
  const blue=new THREE.PointLight(0x40c9ff,95);blue.position.set(3,-1,2);scene.add(blue);
  const green=new THREE.PointLight(0xa2f5cc,55);green.position.set(-3,1,1);scene.add(green);
  const metal=new THREE.MeshPhysicalMaterial({color:0xd7e9f3,metalness:.84,roughness:.11,clearcoat:1,clearcoatRoughness:.07,transparent:true,opacity:1});
  const geo=new THREE.SphereGeometry(.62,48,32);
  const drops=[];
  for(let i=0;i<6;i++){const mesh=new THREE.Mesh(geo,metal.clone());scene.add(mesh);drops.push(mesh)}
  const count=75,coords=new Float32Array(count*3),sizes=[];
  for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2,r=1.2+Math.random()*2.1;coords[i*3]=Math.cos(angle)*r;coords[i*3+1]=Math.sin(angle)*r*.68;coords[i*3+2]=(Math.random()-.5)*1.3;sizes.push(Math.random())}
  const particles=new THREE.BufferGeometry();particles.setAttribute('position',new THREE.BufferAttribute(coords,3));
  const sparkle=new THREE.Points(particles,new THREE.PointsMaterial({color:0x9adff2,size:.038,transparent:true,opacity:.8,depthWrite:false}));scene.add(sparkle);
  const start=performance.now();
  function animate(now){
   if(stopped)return;
   const t=Math.min((now-start)/1000,3.3),join=Math.min(1,Math.max(0,(t-.15)/1.25)),ease=join*join*(3-2*join);
   drops.forEach((mesh,i)=>{
    const a=i*Math.PI*2/drops.length+t*.9;
    mesh.position.set(Math.cos(a)*(1.65*(1-ease)),Math.sin(a)*(1.05*(1-ease))+(i%2?.12:-.12)*(1-ease),Math.sin(a*2)*.35*(1-ease));
    const s=(.3+(i%3)*.11)*(1-ease)+(.68/drops.length**(1/3))*ease;
    mesh.scale.set(s*(1+.08*Math.sin(t*7+i)),s*(1+.1*Math.cos(t*6+i)),s);
    mesh.rotation.set(t*.6+i,t*.9,0);
    mesh.material.opacity=t>1.35?Math.max(0,1-(t-1.35)*2.5):1;
   });
   sparkle.rotation.z=t*.12;sparkle.material.opacity=t>2.5?Math.max(0,3.3-t):.7;
   renderer.render(scene,camera);frame=requestAnimationFrame(animate);
  }
  frame=requestAnimationFrame(animate);
 }catch(e){/* The logo and CSS reveal remain available if WebGL/CDN is unavailable. */}
})();
</script>
