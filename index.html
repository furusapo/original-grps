<script>
(() => {
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.querySelectorAll('.grps-canvas').forEach(canvas=>{
  const w=Number(canvas.dataset.designWidth),h=Number(canvas.dataset.designHeight);
  const load=(kind,callback)=>{
   const obj=canvas.querySelector('.grps-layer-'+kind);
   if(!obj)return;
   const run=()=>{try{const doc=obj.contentDocument;if(doc?.documentElement)callback(doc)}catch(e){console.warn('SVG layer unavailable',kind,e)}};
   obj.addEventListener('load',run);if(obj.contentDocument?.documentElement)run();
  };
  const visible=()=>getComputedStyle(canvas).display!=='none';
  const watch=(x,y,fn)=>{
   const trigger=document.createElement('span');Object.assign(trigger.style,{position:'absolute',left:(x/w*100)+'%',top:(y/h*100)+'%',width:'1px',height:'1px',pointerEvents:'none',visibility:'hidden'});canvas.appendChild(trigger);
   if(reduced||!('IntersectionObserver'in window)){fn();trigger.remove();return}
   const observer=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting&&visible()){fn();observer.disconnect();trigger.remove()}}},{rootMargin:'0px 0px -8% 0px'});
   observer.observe(trigger);
  };
  if(canvas.classList.contains('grps-mobile')){
   load('line',doc=>{
    const lines=[...doc.querySelectorAll('line.grps-line-draw')];

    lines.forEach(line=>{
     const y=Number(line.getAttribute('y1'));
     if(!Number.isFinite(y))return;

     if(reduced || !('IntersectionObserver' in window)){
      line.classList.add('is-drawing');
      return;
     }

     const marker=document.createElement('span');
     Object.assign(marker.style,{
      position:'absolute',
      left:'50%',
      top:(y/h*100)+'%',
      width:'2px',
      height:'2px',
      pointerEvents:'none'
     });
     canvas.appendChild(marker);

     let frame1=0;
     let frame2=0;
     let active=false;

     const reset=()=>{
      cancelAnimationFrame(frame1);
      cancelAnimationFrame(frame2);
      line.classList.remove('is-drawing');
     };

     const observer=new IntersectionObserver(entries=>{
      for(const entry of entries){
       const inside=entry.isIntersecting && visible();

       if(inside===active)continue;
       active=inside;

       if(inside){
        reset();
        frame1=requestAnimationFrame(()=>{
         frame2=requestAnimationFrame(()=>{
          if(active)line.classList.add('is-drawing');
         });
        });
       }else{
        reset();
       }
      }
     },{rootMargin:'0px 0px -12% 0px'});

     observer.observe(marker);
    });
   });
   load('photo',doc=>{
    const groups=[...doc.querySelectorAll('svg > g.grps-photo-piece')];
    const show=()=>{
     groups.forEach((group,index)=>{
      setTimeout(()=>group.classList.add('is-visible'),
       reduced?0:index*650);
     });
    };
    if(reduced||!('IntersectionObserver' in window)){
     show();
    }else{
     const observer=new IntersectionObserver(entries=>{
      if(entries.some(e=>e.isIntersecting)&&visible()){
       show();
       observer.disconnect();
      }
     },{threshold:0.01});
     observer.observe(canvas);
    }
   });
  }else{
   load('line',doc=>{
    const lines=[...doc.querySelectorAll('line')];
    lines.forEach(line=>{const length=line.getTotalLength();line.style.strokeDasharray=String(length);line.style.strokeDashoffset=reduced?'0':String(length)});
    lines.forEach(line=>{const y=Number(line.getAttribute('y1')||line.getAttribute('y2'));if(Number.isFinite(y))watch(w/2,y,()=>{line.style.strokeDashoffset='0'})});
   });
   load('photo',doc=>{
    const groups=[...doc.querySelectorAll('svg > g')];
    groups.forEach(group=>{const b=group.getBBox();watch(b.x+b.width/2,b.y+b.height/2,()=>group.classList.add('is-visible'))});
   });
  }
  const button=canvas.querySelector('.grps-layer-button, .grps-layer-link');
  canvas.querySelectorAll('.grps-hotspot').forEach(link=>{
   const key=link.dataset.action;
   if(!['service-top','contact-top','form','line'].includes(key))return;
   const index=['service-top','contact-top','form','line'].indexOf(key);
   const groupIndex=canvas.classList.contains('grps-mobile')?(index<2?0:-1):(index>=2?index-2:-1);
   if(groupIndex<0)return;
   const active=on=>{try{const groups=button?.contentDocument?.querySelectorAll('svg > g');groups?.[groupIndex]?.classList.toggle('is-active',on)}catch(e){}};
   link.addEventListener('pointerenter',()=>active(true));link.addEventListener('pointerleave',()=>active(false));link.addEventListener('focus',()=>active(true));link.addEventListener('blur',()=>active(false));
  });
 });
})();
</script>

<script type="module">
(async function(){
 const root=document.getElementById('grps-liquid-intro');

 const failSafe=setTimeout(finish,window.__GRPS_INTRO_PREVIEW__?15000:6500);
 window.addEventListener('pageshow',e=>{if(e.persisted&&!window.__GRPS_INTRO_PREVIEW__){clearTimeout(failSafe);finish()}},{once:true});
 try{
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  if(closed)return;
  const stage=root.querySelector('.grps-liquid-stage'),canvas=root.querySelector('canvas'),w=stage.clientWidth,h=stage.clientHeight;
  renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));renderer.setSize(w,h,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,w/h,.1,40);camera.position.z=8;
  scene.add(new THREE.AmbientLight(0xffffff,1.6));
  const key=new THREE.DirectionalLight(0xffffff,4.5);key.position.set(-3,4,6);scene.add(key);
  const rim=new THREE.PointLight(0x8ce4f3,8);rim.position.set(3,1,4);scene.add(rim);
  const cool=new THREE.PointLight(0x99bfff,5);cool.position.set(-4,-2,3);scene.add(cool);
  const logo=new Image();logo.crossOrigin='anonymous';logo.src='./grps_images/glowpas-logo-vertical.png';await new Promise((resolve,reject)=>{logo.onload=resolve;logo.onerror=reject});
  if(closed)return;
  const maskCanvas=document.createElement('canvas');maskCanvas.width=1024;maskCanvas.height=794;
  const ctx=maskCanvas.getContext('2d',{willReadFrequently:true});ctx.clearRect(0,0,1024,730);
  ctx.drawImage(logo,128,45,1026,795,0,0,1024,794);
  const texture=new THREE.CanvasTexture(maskCanvas);texture.colorSpace=THREE.SRGBColorSpace;texture.needsUpdate=true;
  const uniforms={uMask:{value:texture},uTime:{value:0},uReveal:{value:0}};
  const material=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms,vertexShader:`varying vec2 vUv;varying vec3 vNormal;varying vec3 vView;void main(){vUv=uv;vec4 mv=modelViewMatrix*vec4(position,1.);vNormal=normalize(normalMatrix*normal);vView=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,fragmentShader:`uniform sampler2D uMask;uniform float uTime;uniform float uReveal;varying vec2 vUv;varying vec3 vNormal;varying vec3 vView;void main(){float a=texture2D(uMask,vUv).a;if(a<.025)discard;vec3 N=normalize(vNormal);vec3 V=normalize(vView);float rim=pow(1.-max(dot(N,V),0.),2.4);float sweep=exp(-pow((vUv.x-(uTime*.34-.18))*15.,2.));float wave=.5+.5*sin(vUv.x*23.+vUv.y*8.-uTime*3.2);float band=smoothstep(.74,.98,wave);vec3 silver=mix(vec3(.54,.67,.74),vec3(.94,.98,1.),band);silver=mix(silver,vec3(.70,.91,.96),rim*.72);silver+=vec3(.55,.78,.9)*sweep*.42;float edge=smoothstep(0.,.12,vUv.x)*smoothstep(0.,.12,1.-vUv.x)*smoothstep(0.,.10,vUv.y)*smoothstep(0.,.10,1.-vUv.y);gl_FragColor=vec4(silver,a*edge*uReveal);}`});
  const logoMesh=new THREE.Mesh(new THREE.PlaneGeometry(4.25,3.29),material);scene.add(logoMesh);
  const arcs=new THREE.Group();scene.add(arcs);
  for(let i=0;i<3;i++){const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(-3.2,-.55+i*.56,-.25+i*.08),new THREE.Vector3(-1.7,-.18+i*.28,.12),new THREE.Vector3(0,0,.34),new THREE.Vector3(1.8,.20-i*.25,.1),new THREE.Vector3(3.2,.58-i*.54,-.2)]);const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,100,.008+i*.002,6,false),new THREE.MeshPhysicalMaterial({color:i===1?0xb9edf4:0xc8d6dc,metalness:.88,roughness:.17,clearcoat:1,transparent:true,opacity:.6,emissive:0x143543,emissiveIntensity:.12}));arcs.add(tube)}
  const count=18,pos=new Float32Array(count*3),seeds=[];
  for(let i=0;i<count;i++){const angle=i*2.399,rad=2.05+Math.random()*1.0;pos[i*3]=Math.cos(angle)*rad;pos[i*3+1]=Math.sin(angle)*rad*.68;pos[i*3+2]=(Math.random()-.5)*.25;seeds.push({x:pos[i*3],y:pos[i*3+1],p:Math.random()*6.28})}

  raf=requestAnimationFrame(animate);
 }catch(e){/* CSS metal reveal remains available when WebGL is unavailable. */}
