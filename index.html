<script>
document.addEventListener('DOMContentLoaded', () => {
  const headings = document.querySelectorAll(
    '.grps-section > .grps-eyebrow:not(.grps-numbered-eyebrow), #contact .grps-contact-heading > .grps-eyebrow'
  );
  const show = el => el.classList.add('grps-line-visible');
  if (!('IntersectionObserver' in window)) {
    headings.forEach(show);
    return;
  }
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        show(entry.target);
      } else {
        entry.target.classList.remove('grps-line-visible');
      }
    });
  }, { threshold: 0.2 });
  headings.forEach(el => observer.observe(el));
});
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.querySelector('.grps-artwork-wrap');
  const svg = wrap?.querySelector('svg.grps-svg-overlay');
  if (!wrap || !svg) return;

  const lines = [...svg.querySelectorAll('line.grps-draw')];
  if (lines.length !== 5) return;

  const reducedMotion = window.matchMedia(
    '(prefers-reduced-motion: reduce)'
  ).matches;

  let pending = false;

  function checkVisibleLines() {
    pending = false;

    const viewportHeight = window.innerHeight;
    const revealLimit = viewportHeight * 0.9;

    lines.forEach(line => {
      if (line.classList.contains('is-visible')) return;

      const rect = line.getBoundingClientRect();

      if (rect.top <= revealLimit && rect.bottom >= 0) {
        line.classList.add('is-visible');

        if (reducedMotion) {
          line.style.strokeDashoffset = '0';
        }
      }
    });
  }

  function scheduleCheck() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(checkVisibleLines);
  }

  window.addEventListener('scroll', scheduleCheck, { passive: true });
  window.addEventListener('resize', scheduleCheck, { passive: true });
  window.addEventListener('load', scheduleCheck);

  scheduleCheck();
});
</script>


<script>

  );
  const links = wrap?.querySelectorAll(

});

<script id="grps-photo-scroll-reveal-js">
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.querySelector('.grps-artwork-wrap');
  const photo = wrap?.querySelector('object.grps-photo-overlay');
  if (!wrap || !photo) return;

  let initialized = false;

  function setup() {
    if (initialized) return;

    const doc = photo.contentDocument;
    const root = doc?.documentElement;
    if (!root) return;

    const groups = [...root.querySelectorAll('.grps-photo-item')];
    if (groups.length !== 3) return;

    initialized = true;

    const show = group => group.classList.add('is-visible');

    if (!('IntersectionObserver' in window) ||
        window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      groups.forEach(show);
      return;
    }

    const viewBox = root.viewBox.baseVal;
    if (!viewBox.width || !viewBox.height) {
      groups.forEach(show);
      return;
    }

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;

        const index = Number(entry.target.dataset.photoIndex);
        show(groups[index]);
        observer.unobserve(entry.target);
        entry.target.remove();
      });
    }, {
      threshold: 0,
      rootMargin: '0px 0px -10% 0px'
    });

    groups.forEach((group, index) => {
      const bounds = group.getBBox();
      const centerX = bounds.x + bounds.width / 2;
      const centerY = bounds.y + bounds.height / 2;

      const trigger = document.createElement('span');
      trigger.className = 'grps-scroll-trigger';
      trigger.dataset.photoIndex = String(index);
      trigger.style.left =
        ((centerX - viewBox.x) / viewBox.width * 100) + '%';
      trigger.style.top =
        ((centerY - viewBox.y) / viewBox.height * 100) + '%';

      wrap.appendChild(trigger);
      observer.observe(trigger);
    });
  }

  photo.addEventListener('load', setup);

  if (photo.contentDocument?.readyState === 'complete') {
    setup();
  }
});
</script>







<script id="grps-mobile-animation-script">

      @media (prefers-reduced-motion: reduce) {
        .grps-photo-reveal-item {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
      }
    `;
    root.insertBefore(style, root.firstChild);

    groups.forEach(group => {
      group.classList.add('grps-photo-reveal-item');
    });

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        groups.forEach((group, index) => {
          setTimeout(() => {
            group.classList.add('is-visible');
          }, index * 280 + 100);
        });
      });
    });
  }

  obj.addEventListener('load', initialize);
  if (obj.contentDocument?.readyState === 'complete') {
    initialize();
  }
});
</script>
