/* GRPS HEADING LINE ANIMATION */
.grps-section > .grps-eyebrow:not(.grps-numbered-eyebrow)::after,
.grps-contact-heading > .grps-eyebrow::after {
  width: 0 !important;
  transition: width 0.9s ease-out;
}

.grps-section > .grps-eyebrow.grps-line-visible:not(.grps-numbered-eyebrow)::after,
.grps-contact-heading > .grps-eyebrow.grps-line-visible::after {
  width: 4.5cqw !important;
}

@media (max-width:600px) {
  .grps-section > .grps-eyebrow.grps-line-visible:not(.grps-numbered-eyebrow)::after,
  .grps-contact-heading > .grps-eyebrow.grps-line-visible::after {
    width: 44px !important;
  }
}

@media (prefers-reduced-motion: reduce) {
  .grps-section > .grps-eyebrow::after,
  .grps-contact-heading > .grps-eyebrow::after {
    transition: none !important;
  }
}


/* CONTACT LINE POSITION FIX */
#contact .grps-contact-heading > .grps-eyebrow {
  display: inline-block;
  position: relative;
}

#contact .grps-contact-heading > .grps-eyebrow::after {
  position: absolute;
  left: 100%;
  top: 50%;
  transform: translateY(-50%);
}


/* GRPS FLOATING ARROWS */
@keyframes grps-arrow-float {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(8px); }
}

.grps-detail-arrow span {
  display: inline-block;
}

@media (prefers-reduced-motion: no-preference) {
  .grps-detail-arrow span {
    animation: grps-arrow-float 2s ease-in-out infinite;

<script>
document.addEventListener('DOMContentLoaded', () => {
  const headings = document.querySelectorAll(
    '.grps-section > .grps-eyebrow:not(.grps-numbered-eyebrow), #contact .grps-contact-heading > .grps-eyebrow'
  );
  const show = el => el.classList.add('grps-line-visible');
  if (!('IntersectionObserver' in window)) {
    headings.forEach(show);
    return;
  }
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        show(entry.target);
      } else {
        entry.target.classList.remove('grps-line-visible');
      }
    });
  }, { threshold: 0.2 });
  headings.forEach(el => observer.observe(el));
});
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.querySelector('.grps-artwork-wrap');
  const svg = wrap?.querySelector('svg.grps-svg-overlay');
  if (!wrap || !svg) return;

  const lines = [...svg.querySelectorAll('line.grps-draw')];
  if (lines.length !== 5) return;

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const index = Number(entry.target.dataset.lineIndex);
      lines[index]?.classList.add('is-visible');
      observer.unobserve(entry.target);
    });
  }, { threshold: 0, rootMargin: '0px 0px -10% 0px' });

  lines.forEach((line, index) => {
    const x = (Number(line.getAttribute('x1')) +
               Number(line.getAttribute('x2'))) / 2;
    const y = (Number(line.getAttribute('y1')) +
               Number(line.getAttribute('y2'))) / 2;

    const trigger = document.createElement('span');
    trigger.className = 'grps-scroll-trigger';
    trigger.dataset.lineIndex = String(index);
    trigger.style.left = (x / 1440 * 100) + '%';
    trigger.style.top = (y / 4230 * 100) + '%';
    wrap.appendChild(trigger);
    observer.observe(trigger);
  });
});
</script>


<script>
document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.querySelector('.grps-artwork-wrap');
  const groups = wrap?.querySelectorAll(
    '.grps-motion3-overlay > g.grps-hover-item'
  );
  const links = wrap?.querySelectorAll(
    '.grps-contact-form-motion, .grps-contact-line-motion'
  );
  if (!groups || groups.length !== 2 ||
      !links || links.length !== 2) return;

  links.forEach((link, i) => {
    for (const event of ['pointerenter', 'focus']) {
      link.addEventListener(event, () =>
        groups[i].classList.add('is-hovered'));
    }
    for (const event of ['pointerleave', 'blur']) {
      link.addEventListener(event, () =>
        groups[i].classList.remove('is-hovered'));
    }
  });
});
</script>
