<!DOCTYPE html>

<meta charset="utf-8"/>

<title>お問い合わせ｜株式会社グローパス</title>
<meta content="株式会社グローパスへのお問い合わせページです。イベントの企画・運営についてお気軽にご相談ください。" name="description"/>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:#fff;color:#173b60;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
a{color:inherit;text-decoration:none}

/* header */
.gp-header{background:#fff;border-bottom:1px solid #e7edf1}
.gp-header-main{
  width:min(1280px,calc(100% - 48px));min-height:104px;margin:auto;
  display:flex;align-items:center;justify-content:space-between;gap:28px
}
.gp-brand{display:flex;align-items:center;gap:22px}
.gp-brand img{height:70px;width:auto;display:block}
.gp-brand-text{
  padding-left:22px;border-left:1px solid #cfdae2;
  font-size:17px;font-weight:700;white-space:nowrap
}
.gp-toplinks{display:flex;align-items:center;gap:30px;font-size:14px;font-weight:700}
.gp-contact{
  color:#fff;padding:16px 28px;border-radius:14px;
  background:linear-gradient(90deg,#058bd1,#10b8cf)
}
.gp-nav{border-top:1px solid #edf1f4}
.gp-nav-inner{
  width:min(1280px,calc(100% - 48px));min-height:66px;margin:auto;
  display:flex;justify-content:flex-end;align-items:center;gap:36px;
  font-size:15px;font-weight:700;white-space:nowrap
}

/* page title */
.page-title{
  position:relative;overflow:hidden;background:#fff;
  border-bottom:1px solid #edf1f4
}
.page-title-inner{
  width:min(1100px,calc(100% - 48px));height:250px;margin:auto;
  display:flex;align-items:center;position:relative
}
.page-title-inner:before{
  content:"";position:absolute;width:270px;height:270px;left:-160px;top:-130px;
  background:#e4f7fc;border-radius:50%
}
.page-title-inner:after{
  content:"CONTACT";position:absolute;left:82px;top:125px;
  color:rgba(90,160,195,.13);font-size:92px;font-weight:700;line-height:1
}
.page-title h1{
  position:relative;z-index:2;margin:0;padding-left:90px;
  font-size:38px;color:#12385f
}
.page-title h1:before{
  content:"";position:absolute;left:0;top:50%;width:64px;height:3px;
  background:#12385f;transform:translateY(-50%)
}

/* form */
.contact-wrap{padding:78px 24px 110px}
.contact-inner{width:min(940px,100%);margin:auto}
.lead{
  margin:0 0 40px;color:#536c7d;font-size:15px;line-height:2
}
.required-note{margin:0 0 18px;color:#768895;font-size:13px}
.form-row{
  display:grid;grid-template-columns:240px 1fr;gap:34px;
  padding:24px 0;border-top:1px solid #e2ebf0
}
.form-row:last-of-type{border-bottom:1px solid #e2ebf0}
.form-label{
  padding-top:10px;font-size:14px;font-weight:700;color:#173b60
}
.req{
  display:inline-block;margin-left:8px;padding:2px 7px;border-radius:20px;
  color:#fff;background:#0aa3c3;font-size:10px;vertical-align:2px
}
input[type="text"],input[type="email"],input[type="tel"],textarea{
  width:100%;border:1px solid #ccdce5;border-radius:8px;background:#fff;
  padding:14px 15px;font:inherit;font-size:15px;outline:none
}
input:focus,textarea:focus{border-color:#0b9fc1;box-shadow:0 0 0 3px rgba(11,159,193,.09)}
textarea{min-height:210px;resize:vertical}
.radio-group{display:flex;gap:28px;align-items:center;padding-top:10px}
.radio-group label{display:flex;gap:8px;align-items:center;font-size:15px}
.submit-area{text-align:center;padding-top:40px}
.submit-btn{
  border:0;cursor:pointer;min-width:280px;padding:17px 34px;border-radius:999px;
  color:#fff;font-size:15px;font-weight:700;
  background:linear-gradient(90deg,#087bd0,#10bca9)
}
.form-status{
  margin-top:18px;color:#5f7483;font-size:13px;line-height:1.7
}
footer{
  padding:36px 24px;border-top:1px solid #e7edf1;
  text-align:center;color:#7c8c97;font-size:12px
}
@media(max-width:820px){
  .gp-header-main,.gp-nav-inner{width:calc(100% - 32px)}
  .gp-brand img{height:50px}
  .gp-brand-text{font-size:10px;white-space:normal;padding-left:10px}
  .gp-toplinks>a:not(.gp-contact){display:none}
  .gp-nav{overflow-x:auto}
  .gp-nav-inner{justify-content:flex-start;gap:22px;font-size:12px}
  .page-title-inner{height:200px;width:calc(100% - 32px)}
  .page-title h1{font-size:30px;padding-left:64px}
  .page-title h1:before{width:44px;height:2px}
  .page-title-inner:after{left:55px;top:108px;font-size:58px}
  .form-row{display:block;padding:20px 0}
  .form-label{padding:0 0 12px}
}
</style>

<body>
<header id="grps-independent-header"><div class="grps-header-inner"><a id="grps-header-logo" href="../index.html#top" aria-label="グローパス トップページ"><img src="../grps_images/glowpas-logo-horizontal.png" alt="グローパス"></a><button class="menu-button" id="menuOpen" type="button" aria-controls="sideMenu" aria-expanded="false" aria-label="メニューを開く"><img class="hamburger-icon" src="../grps_images/hamburger-menu.png" alt=""></button></div></header>
<section class="page-title">
<div class="page-title-inner">
<h1>お問い合わせ</h1>
</div>
</section>
<main class="contact-wrap">
<div class="contact-inner">
<p class="lead">
      当ホームページをご覧いただき、ありがとうございます。<br/>
      お問い合わせの方は、下記のフォームに必要事項をご入力ください。<br/>
      通常、数日以内にご返信いたします。
    </p>
<p class="required-note">「必須」の項目は入力必須です。</p>
<form id="growpas-contact-form" onsubmit="return false;">
<div class="form-row">
<div class="form-label">法人・個人</div>
<div class="radio-group">
<label><input checked="" name="type" type="radio" value="法人"/> 法人</label>
<label><input name="type" type="radio" value="個人"/> 個人</label>
</div>
</div>
<div class="form-row">
<label class="form-label" for="name">お名前 <span class="req">必須</span></label>
<div><input id="name" name="name" required="" type="text"/></div>
</div>
<div class="form-row">
<label class="form-label" for="kana">ふりがな <span class="req">必須</span></label>
<div><input id="kana" name="kana" required="" type="text"/></div>
</div>
<div class="form-row">
<label class="form-label" for="company">会社名 <span class="req">必須</span></label>
<div><input id="company" name="company" required="" type="text"/></div>
</div>
<div class="form-row">
<label class="form-label" for="postal">郵便番号</label>
<div><input id="postal" inputmode="numeric" name="postal" type="text"/></div>
</div>
<div class="form-row">
<label class="form-label" for="address">ご住所 <span class="req">必須</span></label>
<div><input id="address" name="address" required="" type="text"/></div>
</div>
<div class="form-row">
<label class="form-label" for="tel">お電話 <span class="req">必須</span></label>
<div><input id="tel" name="tel" required="" type="tel"/></div>
</div>
<div class="form-row">
<label class="form-label" for="email">メールアドレス <span class="req">必須</span></label>
<div><input id="email" name="email" required="" type="email"/></div>
</div>
<div class="form-row">
<label class="form-label" for="email2">メールアドレス（確認用） <span class="req">必須</span></label>
<div><input id="email2" name="email2" required="" type="email"/></div>
</div>
<div class="form-row">
<label class="form-label" for="message">お問い合わせ内容 <span class="req">必須</span></label>
<div><textarea id="message" name="message" required=""></textarea></div>
</div>
<div class="submit-area">
<button class="submit-btn" type="submit">送信する</button>
<div class="form-status" id="form-status"></div>
</div>
</form>
</div>
</main>
<footer class="grps-site-footer" aria-label="サイトフッター"><a class="grps-footer-logo" href="../index.html#top" aria-label="トップページに戻る"><img src="../grps_images/glowpas-logo-vertical.png" alt="グローパス"></a></footer>

<div id="menuOverlay" class="menu-overlay"></div>
<aside id="sideMenu" class="side-menu" aria-hidden="true" aria-label="サイトメニュー" inert>
<button id="menuClose" class="menu-close" type="button" aria-label="メニューを閉じる">×</button>

<a href="../recruit/index.html"><small>RECRUIT</small>リクルート</a>
<a href="../privacy/index.html"><small>PRIVACY</small>個人情報</a>

<a href="../company/index.html#access"><small>ACCESS</small>アクセス</a>
<a href="../contact/index.html"><small>CONTACT</small>お問い合わせ</a>
</nav><p class="menu-footer">Event for a Better Tomorrow.</p></aside>
<script>
const contactForm = document.getElementById('growpas-contact-form');
const submitButton = contactForm.querySelector('.submit-btn');
const formStatus = document.getElementById('form-status');
contactForm.addEventListener('submit', async function(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const email2 = document.getElementById('email2').value.trim();
  if(email !== email2){
    formStatus.textContent = 'メールアドレス（確認用）が一致していません。';
    document.getElementById('email2').focus();
    return;
  }
  submitButton.disabled = true;
  submitButton.textContent = '送信中...';
  formStatus.textContent = '';
  const formData = new FormData(contactForm);
  formData.delete('email2');
  try{
    const response = await fetch('https://formspree.io/f/xyezooro', {
      method: 'POST',
      body: formData,
      headers: {'Accept': 'application/json'}
    });
    if(response.ok){
      contactForm.reset();
      formStatus.textContent = 'お問い合わせを送信しました。ありがとうございます。';
      submitButton.textContent = '送信しました';
    }else{
      formStatus.textContent = '送信できませんでした。時間をおいてもう一度お試しください。';
      submitButton.disabled = false;
      submitButton.textContent = '送信する';
    }
  }catch(error){
    formStatus.textContent = '通信エラーが発生しました。時間をおいてもう一度お試しください。';
    submitButton.disabled = false;
    submitButton.textContent = '送信する';
  }
});
</script>
